            - heading "Our Vision" [level=2] [ref=e160]
            - paragraph [ref=e161]: Fantasy football has always been about passion, strategy, and bragging rights. But most platforms lock you into a full-season commitment — punishing late joiners and rewarding those who got lucky in August. We built this platform to change that. With rolling 5-gameweek competitions, anyone can jump in at any time and compete on equal footing. Add AI-powered insights and a coin economy, and you have a fantasy experience that rewards skill, not just luck. We believe every Premier League fan deserves a shot at the top of the leaderboard.
          - generic [ref=e162]:
            - heading "How We Built It" [level=2] [ref=e163]
            - paragraph [ref=e164]: "Our platform is powered by real-time data from API-Football, covering every Premier League fixture, player stat, and match event. Scoring is calculated automatically using FPL-style rules. The AI features use GPT to analyze squad composition, player form, and upcoming fixtures — giving you transfer suggestions and match predictions backed by data, not guesswork. Everything runs on a daily automated pipeline: gameweeks sync, scores calculate, competitions transition, and rewards distribute — all without manual intervention."
