name: Sync (full)

on:
    schedule:
        - cron: '0 6 * * *'
    workflow_dispatch:

permissions:
    contents: read

# One sync at a time: overlapping runs must not race on the same rows.
concurrency:
    group: sync
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            STORAGE_DATABASE_URL: ${{ secrets.STORAGE_DATABASE_URL }}
            FOOTBAL_API_KEY: ${{ secrets.FOOTBAL_API_KEY }}
            FOOTBAL_API_BASE_URL: ${{ secrets.FOOTBAL_API_BASE_URL }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run sync -- full
